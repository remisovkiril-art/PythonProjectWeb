{% extends 'main/layout.html' %}
{% load static %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm">

            <img src="{% static 'main/images/'|add:card.image %}"
                 class="card-img-top"
                 alt="{{ card.title }}">

            <div class="card-body">

                <h2 class="card-title">
                    {{ card.title }}
                </h2>

                <p class="card-text">
                    {{ card.description }}
                </p>

                <a href="{% url 'home' %}" class="btn btn-primary">
                    На головну
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
