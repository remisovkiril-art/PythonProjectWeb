{% extends 'main/layout.html' %}
{% load static %}
{% block title %}
Реєстрація
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h2 class="text-center mb-4">
                    Реєстрація
                </h2>

                <form id="registerForm"
                      action="{% url 'register' %}"
                      method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Ім'я
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               placeholder="Введіть ім'я"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="Введіть email"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Пароль
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Введіть пароль"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">

                        Зареєструватися

                    </button>

                </form>

                <div id="result" class="mt-3 text-center"></div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block scripts %}
<script defer src="{% static 'main/js/registration.js' %}"></script>
{% endblock %}
